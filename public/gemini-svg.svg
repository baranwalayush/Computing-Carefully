<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Subtle gradient for refined metallic touch -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D8DBE2" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#25272c" />

  <!-- Minimal Border Inset -->
  <rect x="28" y="28" width="456" height="456" rx="76" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Monogram -->
  <g id="monogram">
    <!-- Serif A -->
    <text x="175" y="318" text-anchor="middle" font-family="&#39;Playfair Display&#39;, &#39;Didot&#39;, &#39;Bodoni MT&#39;, &#39;Cinzel&#39;, serif" font-size="210" font-weight="600" letter-spacing="-6" fill="url(#textGrad)">A</text>

    <!-- Serif B -->
    <text x="315" y="318" text-anchor="middle" font-family="&#39;Playfair Display&#39;, &#39;Didot&#39;, &#39;Bodoni MT&#39;, &#39;Cinzel&#39;, serif" font-size="210" font-weight="600" letter-spacing="-6" fill="url(#textGrad)">B</text>

    <!-- Accent Period / Focal Point -->
    <circle cx="410" cy="308" r="7.5" fill="#E0A96D" />
  </g>
</svg>